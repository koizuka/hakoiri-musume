name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

# Use shared concurrency group for all deployments
concurrency:
  group: "github-pages-deployment"
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    name: Remove PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup PR Preview
        uses: koizuka/pr-preview-action@3c83fb8474344c71cabade2154768b143278e9b1 # v1.1.2
        with:
          action: cleanup
          base-url: https://koizuka.github.io/hakoiri-musume
          token: ${{ secrets.GITHUB_TOKEN }}
